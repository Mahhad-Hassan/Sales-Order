<main class="min-h-screen p-[clamp(16px,3vw,40px)] max-[700px]:p-[10px]">
  <form class="mx-auto w-full max-w-[1120px] border border-[#a6a6a6] bg-white px-[30px] pt-[26px] pb-6 shadow-[0_3px_14px_rgb(34_53_34_/_8%)] max-[700px]:px-3 max-[700px]:pt-4 max-[700px]:pb-[18px]" [formGroup]="orderForm">
    <header class="mb-[18px] grid grid-cols-[1.09fr_1.29fr_repeat(4,1fr)_1.29fr_repeat(3,1fr)] grid-rows-[74px_48px] max-[700px]:grid-rows-[62px_44px]">
      <div class="col-[1/7] row-[1/2] flex items-center gap-3 pl-1 font-[Arial,sans-serif] text-4xl font-bold text-[#355224] max-[700px]:text-[28px]">
        <span>AGROVISIONS</span>
        <img class="block h-[74px] w-auto object-contain" src="/AgroVisions%20Logo.png" alt="AgroVisions logo" />
      </div>
<div class="col-[9/11] row-[1/3] flex h-[38px] min-w-0 items-center gap-[5px] self-end overflow-hidden border border-[#a6a6a6] bg-white px-2 max-[700px]:gap-[3px] max-[700px]:px-1">
  <label class="inline-flex shrink-0 items-center whitespace-nowrap text-xs font-bold max-[700px]:text-[10px]" for="order-date">Date:</label>
  <input
    id="order-date"
    aria-label="Date"
    lang="en-US"
    type="date"
    formControlName="date"
    class="h-[30px] min-h-0 min-w-0 w-0 flex-1 border-0 bg-transparent p-0 text-xs max-[700px]:h-7 max-[700px]:text-[10px]"
  />
</div>
      <div class="col-[1/4] row-[2/3] flex min-w-0 items-center border border-[#858585] px-[10px] text-[18px] font-bold text-[#353535] max-[700px]:px-[6px] max-[700px]:text-sm">Sales Order (V4)</div>
      <div class="customer-field relative col-[4/7] row-[2/3] min-w-0 border border-[#858585] p-0 text-[18px] font-bold text-[#353535] max-[700px]:px-[6px] max-[700px]:text-sm">
        <button
          class="relative flex h-full w-full items-center justify-center border-0 bg-transparent px-8 text-[15px] font-bold text-[#353535] cursor-pointer"
          type="button"
          aria-haspopup="listbox"
          [attr.aria-expanded]="customerDropdownOpen"
          (click)="toggleCustomerDropdown()"
          (keydown.escape)="closeCustomerDropdown()"
        >
          <span>Customer</span>
          <span class="absolute right-3 h-0 w-0 border-x-[5px] border-x-transparent border-t-[6px] border-t-[currentColor]" aria-hidden="true"></span>
        </button>
        @if (customerDropdownOpen) {
          <div class="absolute z-[5] top-full -right-px -left-px min-h-12 border border-[#858585] bg-white shadow-[0_3px_8px_rgb(34_53_34_/_14%)]" role="listbox" aria-label="Customer options"></div>
        }
      </div>
    </header>

    <section class="grid grid-cols-2 border border-[#a6a6a6] max-[700px]:grid-cols-1" aria-label="Order parties">
      <section class="min-w-0 pb-2" formGroupName="billTo">
        <h2 class="m-0 mb-2 border-b border-[#a6a6a6] bg-[#f7c58c] px-2 py-[5px] text-sm leading-[1.3]">BILL TO:</h2>
        <div class="party-field">
          <label for="bill-name">NAME</label>
          <input id="bill-name" type="text" formControlName="name" />
        </div>
        <div class="party-field">
          <label for="bill-company">COMPANY NAME</label>
          <input id="bill-company" type="text" formControlName="companyName" />
        </div>
        <div class="party-field address-field">
          <label for="bill-address">POSTAL ADDRESS</label>
          <textarea id="bill-address" rows="2" formControlName="postalAddress"></textarea>
        </div>
        <div class="party-field">
          <label for="bill-phone">PHONE NO</label>
          <input id="bill-phone" type="text" formControlName="phoneNo" />
        </div>
        <div class="party-field">
          <label for="bill-fax">FAX NO</label>
          <input id="bill-fax" type="text" formControlName="faxNo" />
        </div>
        <div class="party-field">
          <label for="bill-email">EMAIL</label>
          <input id="bill-email" type="text" formControlName="email" />
        </div>
        <div class="party-field">
          <label for="bill-ntn">NTN</label>
          <input id="bill-ntn" type="text" formControlName="ntn" />
        </div>
      </section>

      <section class="min-w-0 border-l border-[#a6a6a6] pb-2 max-[700px]:border-l-0 max-[700px]:border-t" formGroupName="shipTo">
        <h2 class="m-0 mb-2 border-b border-[#a6a6a6] bg-[#f7c58c] px-2 py-[5px] text-sm leading-[1.3]">SHIP TO:</h2>
        <div class="party-field">
          <label for="ship-name">NAME</label>
          <input id="ship-name" type="text" formControlName="name" />
        </div>
        <div class="party-field">
          <label for="ship-company">COMPANY NAME</label>
          <input id="ship-company" type="text" formControlName="companyName" />
        </div>
        <div class="party-field address-field">
          <label for="ship-address">POSTAL ADDRESS</label>
          <textarea id="ship-address" rows="2" formControlName="postalAddress"></textarea>
        </div>
        <div class="party-field">
          <label for="ship-phone">PHONE NO</label>
          <input id="ship-phone" type="text" formControlName="phoneNo" />
        </div>
        <div class="party-field">
          <label for="ship-fax">FAX NO</label>
          <input id="ship-fax" type="text" formControlName="faxNo" />
        </div>
        <div class="party-field">
          <label for="ship-email">EMAIL</label>
          <input id="ship-email" type="text" formControlName="email" />
        </div>
        <div class="party-field">
          <label for="ship-ntn">NTN</label>
          <input id="ship-ntn" type="text" formControlName="ntn" />
        </div>
      </section>
    </section>

    <section class="mt-2 grid grid-cols-4 border-t border-l border-[#a6a6a6] max-[700px]:grid-cols-2" aria-label="Order dates and terms">
      <label class="flex min-w-0 flex-col">
        <span class="flex min-h-[29px] items-center border border-t-0 border-l-0 border-[#a6a6a6] bg-[#91cddd] px-2 py-1 text-xs font-bold">DELIVERY DATE</span>
        <input class="h-[31px] w-full min-w-0 rounded-none border border-t-0 border-l-0 border-[#a6a6a6] bg-white px-2 py-1 text-[13px] text-[#222]" type="text" aria-label="Delivery date" formControlName="deliveryDate" />
      </label>
      <label class="flex min-w-0 flex-col">
        <span class="flex min-h-[29px] items-center border border-t-0 border-l-0 border-[#a6a6a6] bg-[#91cddd] px-2 py-1 text-xs font-bold">DUE DATE</span>
        <input class="h-[31px] w-full min-w-0 rounded-none border border-t-0 border-l-0 border-[#a6a6a6] bg-white px-2 py-1 text-[13px] text-[#222]" type="text" aria-label="Due date" formControlName="dueDate" />
      </label>
      <label class="flex min-w-0 flex-col">
        <span class="flex min-h-[29px] items-center border border-t-0 border-l-0 border-[#a6a6a6] bg-[#91cddd] px-2 py-1 text-xs font-bold">PAYMENT TERMS</span>
        <input class="h-[31px] w-full min-w-0 rounded-none border border-t-0 border-l-0 border-[#a6a6a6] bg-white px-2 py-1 text-[13px] text-[#222]" type="text" aria-label="Payment terms" formControlName="paymentTerms" />
      </label>
      <label class="flex min-w-0 flex-col">
        <span class="flex min-h-[29px] items-center border border-t-0 border-l-0 border-[#a6a6a6] bg-[#91cddd] px-2 py-1 text-xs font-bold">INCOTERM</span>
        <input class="h-[31px] w-full min-w-0 rounded-none border border-t-0 border-l-0 border-[#a6a6a6] bg-white px-2 py-1 text-[13px] text-[#222]" type="text" aria-label="Incoterm" formControlName="incoterm" />
      </label>
    </section>

    <section class="mt-[17px]" aria-label="Quantity">
      <div class="overflow-x-auto">
        <table class="items-table w-full min-w-[760px] table-fixed border-collapse text-[13px] text-[#222]">
          <colgroup>
            <col class="w-[10.2%]" />
            <col class="w-[12.1%]" />
            <col class="w-[9.3%]" />
            <col class="w-[9.3%]" />
            <col class="w-[9.3%]" />
            <col class="w-[9.3%]" />
            <col class="w-[12.1%]" />
            <col class="w-[9.3%]" />
            <col class="w-[9.3%]" />
            <col class="w-[9.3%]" />
          </colgroup>
          <thead>
            <tr>
              <th class="h-9 bg-[#c3d69b] text-center font-bold" colspan="2">Quantity</th>
              <th class="h-9 bg-[#c3d69b] text-center font-bold">Unit</th>
              <th class="h-9 bg-[#c3d69b] text-center font-bold" colspan="3">Product Name</th>
              <th class="h-9 bg-[#c3d69b] text-center font-bold" colspan="2">Unit Price</th>
              <th class="h-9 bg-[#c3d69b] text-center font-bold" colspan="2">Total</th>
            </tr>
          </thead>
          <tbody formArrayName="items">
            @for (row of itemRows.controls; track $index; let rowIndex = $index) {
              <tr [formGroupName]="rowIndex">
                <td class="text-center" colspan="2"><input class="h-full w-full min-w-0 border-0 bg-transparent px-[7px] py-[5px] text-[#222] outline-offset-[-2px]" aria-label="Quantity" type="text" formControlName="quantity" /></td>
                <td><input class="h-full w-full min-w-0 border-0 bg-transparent px-[7px] py-[5px] text-[#222] outline-offset-[-2px]" aria-label="Unit" type="text" formControlName="unit" /></td>
                <td class="text-center" colspan="3"><input class="h-full w-full min-w-0 border-0 bg-transparent px-[7px] py-[5px] text-[#222] outline-offset-[-2px]" aria-label="Product Name" type="text" formControlName="productName" /></td>
                <td colspan="2"><input class="h-full w-full min-w-0 border-0 bg-transparent px-[7px] py-[5px] text-[#222] outline-offset-[-2px]" aria-label="Unit Price" type="text" formControlName="unitPrice" /></td>
                <td colspan="2">
                  <div class="flex h-[38px] items-stretch">
                    <input class="h-full w-full min-w-0 flex-1 border-0 bg-transparent px-[7px] py-[5px] text-[#222] outline-offset-[-2px]" aria-label="Total" type="text" formControlName="total" />
                    @if (rowIndex > 0) {
                      <button class="flex-none border-0 border-l border-[#b9b9b9] bg-[#f3f5ef] px-2 text-[11px] text-[#4a4a4a] cursor-pointer hover:bg-[#f7c58c]" type="button" aria-label="Remove Row" (click)="removeRow(rowIndex)">
                        Remove
                      </button>
                    }
                  </div>
                </td>
              </tr>
            }
          </tbody>
          <tfoot>
            <tr class="balance-row">
              <td class="border-0" colspan="4"></td>
              <th class="bg-white px-[10px] text-right text-xs" colspan="4">TOTAL BALANCE INCLUDING TAX</th>
              <td class="bg-[#dce6f1]" colspan="2">
                <input class="min-h-[38px] w-full border-0 bg-transparent px-2 py-[5px]" aria-label="Total balance including tax" type="text" formControlName="totalBalanceIncludingTax" />
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="flex justify-end pt-[9px]">
        <button class="inline-flex min-h-[34px] items-center gap-[7px] rounded-sm border border-[#6c8753] bg-[#e6eddc] px-3 text-[13px] font-bold text-[#304322] cursor-pointer hover:bg-[#d6e2c7]" type="button" (click)="addRow()"><span class="text-[18px] leading-none" aria-hidden="true">+</span> Add Row</button>
      </div>
    </section>
  </form>
</main>
